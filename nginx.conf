server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Behind SWAG, redirects like /install -> /install/ must stay relative or they
  # point at the container's own port.
  absolute_redirect off;

  location = /index.html {
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico)$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
